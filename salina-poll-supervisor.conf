[program:salina-poll]
command=bash /workspace/projects/workspace/scripts/salina-poll.sh
directory=/workspace/projects/workspace
autostart=true
autorestart=true
startretries=5
user=root
stdout_logfile=/var/log/salina-poll.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/salina-poll-error.log
killasgroup=true
stopasgroup=true
