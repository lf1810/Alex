name: Bug 报告
description: 报告可以稳定复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    attributes:
      label: 问题描述
      description: 请说明实际结果和期望结果。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 复现步骤
      placeholder: "1. 打开…\n2. 点击…\n3. 出现…"
    validations:
      required: true
  - type: input
    attributes:
      label: 浏览器和操作系统
      placeholder: "Chrome 130 / macOS 15"
    validations:
      required: true
  - type: textarea
    attributes:
      label: 补充信息
      description: 请勿上传包含他人面部或私人环境的摄像头录屏。
